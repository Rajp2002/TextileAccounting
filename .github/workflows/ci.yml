name: CI

# Secret-free verification gate. Checks run through the isolated command
# wrapper, which blanks service credentials, points Supabase at a closed
# loopback port, and keeps the opt-in live Supabase test skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node scripts/performance/isolated-command.mjs node node_modules/typescript/bin/tsc --noEmit --incremental false

      - name: Unit and contract tests
        run: node scripts/performance/isolated-command.mjs npx vitest run

      # The whole repository is lint-clean since Phase 2B, so any error or
      # warning fails (eslint --max-warnings=0).
      - name: Lint
        run: node scripts/performance/isolated-command.mjs npm run lint

  database:
    name: Disposable PostgreSQL regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Run migrations and database behavior tests
        run: node scripts/performance/isolated-command.mjs npm run test:db
